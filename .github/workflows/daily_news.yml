name: Stock News

on:
  workflow_dispatch:
    inputs:
      hours:
        description: "Time frame to search news"
        required: true
        default: "24"
        type: choice
        options:
          - "24"
          - "48"
          - "72"

jobs:
  run_and_email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run News Script
        env:
          SERPER_API_KEY: ${{ secrets.SERPER_API_KEY }}
          SEARCH_WINDOW_HOURS: ${{ inputs.hours }}
        run: python main.py

      - name: Send Email with CSV
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.SENDER_EMAIL }}
          password: ${{ secrets.SENDER_PASSWORD }}
          subject: Stock News Report - Last ${{ inputs.hours }} Hours
          body: "Attached is the stock news report for the last ${{ inputs.hours }} hours."
          to: ${{ secrets.RECEIVER_EMAIL }}
          from: Stock News Bot <${{ secrets.SENDER_EMAIL }}>
          attachments: daily_stock_news.csv

      - name: Keep CSV as artifact
        uses: actions/upload-artifact@v4
        with:
          name: stock-news-csv
          path: daily_stock_news.csv
